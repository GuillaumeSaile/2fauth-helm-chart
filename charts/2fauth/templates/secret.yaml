{{- /*
Holds every credential the chart manages itself. Fields pointed at an
`existingSecret` are deliberately absent here.

`app-key` is resolved through the `2fauth.appKey` helper, which reuses the
value already stored in this Secret on upgrades — rotating it would make every
stored 2FA secret undecryptable.
*/ -}}
{{- $needsAppKey := not .Values.appKey.existingSecret }}
{{- $needsDbPassword := and (ne .Values.database.type "sqlite") .Values.database.password (not .Values.database.existingSecret) }}
{{- $needsMailPassword := and .Values.mail.password (not .Values.mail.existingSecret) }}
{{- $usesRedis := or (eq .Values.config.cacheDriver "redis") (eq .Values.config.sessionDriver "redis") }}
{{- $needsRedisPassword := and $usesRedis .Values.redis.password (not .Values.redis.existingSecret) }}
{{- $needsOpenid := and .Values.config.sso.openid.enabled (not .Values.config.sso.openid.existingSecret) }}
{{- $needsGithub := and .Values.config.sso.github.enabled (not .Values.config.sso.github.existingSecret) }}
{{- $needsPreviousKeys := .Values.appKey.previousKeys }}
{{- if or $needsAppKey $needsDbPassword $needsMailPassword $needsRedisPassword $needsOpenid $needsGithub $needsPreviousKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "2fauth.secretName" . }}
  namespace: {{ include "2fauth.namespace" . }}
  labels:
    {{- include "2fauth.labels" . | nindent 4 }}
  {{- with (include "2fauth.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if $needsAppKey }}
  app-key: {{ include "2fauth.appKey" . | b64enc | quote }}
  {{- end }}
  {{- with .Values.appKey.previousKeys }}
  app-previous-keys: {{ . | b64enc | quote }}
  {{- end }}
  {{- if $needsDbPassword }}
  db-password: {{ .Values.database.password | b64enc | quote }}
  {{- end }}
  {{- if $needsMailPassword }}
  mail-password: {{ .Values.mail.password | b64enc | quote }}
  {{- end }}
  {{- if $needsRedisPassword }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
  {{- if $needsOpenid }}
  openid-client-secret: {{ .Values.config.sso.openid.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if $needsGithub }}
  github-client-secret: {{ .Values.config.sso.github.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
